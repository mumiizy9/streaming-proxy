<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StreamHub - Anime | Series | Movies</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root {
    --bg: #0a0a0f;
    --bg2: #12121a;
    --bg3: #1a1a28;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --text: #e0e0e0;
    --text2: #888;
    --success: #00b894;
    --danger: #ff6b6b;
    --warning: #ffd93d;
    --card-bg: #16161f;
    --border: #2a2a3a;
    --shadow: rgba(0,0,0,0.4);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

/* HEADER */
.header {
    background: linear-gradient(135deg, var(--bg2), var(--bg3));
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
}
.header .logo {
    font-size: 1.3em;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
}
.header .search-box {
    flex: 1;
    max-width: 400px;
    position: relative;
}
.header input[type="text"] {
    width: 100%;
    padding: 8px 36px 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border .2s;
}
.header input:focus { border-color: var(--accent); }
.search-btn {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--accent);
    border: none;
    color: #fff;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
}
.back-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    display: none;
    white-space: nowrap;
}
.back-btn:hover { border-color: var(--accent); }

/* SOURCE TABS */
.source-tabs {
    display: flex;
    gap: 0;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}
.source-tab {
    padding: 10px 18px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    font-size: 14px;
    color: var(--text2);
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 6px;
}
.source-tab:hover { color: var(--text); }
.source-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: rgba(108,92,231,0.08);
}

/* CATEGORY FILTER */
.category-bar {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
}
.cat-btn {
    padding: 5px 14px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text2);
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
    transition: all .2s;
}
.cat-btn:hover { border-color: var(--accent); color: var(--text); }
.cat-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}

/* CATALOG GRID */
.catalog {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
    padding: 16px;
}
.card {
    background: var(--card-bg);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    border: 1px solid transparent;
}
.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px var(--shadow);
    border-color: var(--accent);
}
.card .poster {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    background: var(--bg3);
    display: block;
}
.card .info {
    padding: 8px 10px;
}
.card .info h3 {
    font-size: 12px;
    line-height: 1.3;
    max-height: 2.6em;
    overflow: hidden;
    color: var(--text);
}
.card .quality-badge {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--accent);
    color: #fff;
    margin-top: 4px;
}

/* DETAIL VIEW */
.detail-view {
    display: none;
    padding: 16px;
    max-width: 900px;
    margin: 0 auto;
}
.detail-header {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
}
.detail-poster {
    width: 160px;
    min-width: 160px;
    border-radius: 10px;
    overflow: hidden;
}
.detail-poster img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
}
.detail-info h1 {
    font-size: 1.2em;
    margin-bottom: 8px;
    line-height: 1.4;
}
.detail-info .synopsis {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.5;
    margin-bottom: 12px;
}
.episode-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
}
.ep-btn {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    transition: all .2s;
}
.ep-btn:hover { border-color: var(--accent); background: var(--bg3); }
.ep-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* PLAYER VIEW */
.player-view {
    display: none;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px 16px;
}
.player-container {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* 16:9 */
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
}
.player-container video,
.player-container iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
}
.player-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    flex-wrap: wrap;
}
.ctrl-btn {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    transition: all .2s;
}
.ctrl-btn:hover { border-color: var(--accent); background: var(--bg3); }
.ctrl-btn.active { background: var(--accent); color: #fff; }
.ctrl-btn.danger { border-color: var(--danger); color: var(--danger); }
.ctrl-btn.danger:hover { background: var(--danger); color: #fff; }

.server-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}
.server-tab {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg2);
    color: var(--text2);
    cursor: pointer;
    font-size: 12px;
    transition: all .2s;
}
.server-tab:hover { border-color: var(--accent); }
.server-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.player-title {
    font-size: 1em;
    color: var(--text);
    margin-bottom: 8px;
}
.stall-indicator {
    display: none;
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(255,107,107,0.9);
    color: #fff;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    z-index: 10;
}

/* BRIGHTNESS CONTROL */
.brightness-ctrl {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text2);
    padding: 4px 0;
}
.brightness-ctrl input[type=range] {
    -webkit-appearance: none;
    width: 100px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    accent-color: var(--accent);
}
.brightness-ctrl input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 4px rgba(108,92,231,0.6);
}
.brightness-ctrl .bval {
    min-width: 38px;
    text-align: right;
    font-size: 12px;
    color: var(--text);
}

/* LOADING */
.loading {
    text-align: center;
    padding: 40px;
    color: var(--text2);
}
.loading .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* LOAD MORE */
.load-more {
    text-align: center;
    padding: 20px;
}
.load-more button {
    padding: 10px 30px;
    border-radius: 20px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    font-size: 14px;
    transition: all .2s;
}
.load-more button:hover { background: var(--accent); color: #fff; }

/* TOAST */
.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--bg3);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 13px;
    z-index: 1000;
    opacity: 0;
    transition: all .3s;
    pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* RESPONSIVE */
@media (max-width: 600px) {
    .header { padding: 8px 10px; gap: 8px; }
    .header .logo { font-size: 1em; }
    .catalog { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 10px; }
    .card .info h3 { font-size: 11px; }
    .detail-header { flex-direction: column; align-items: center; text-align: center; }
    .detail-poster { width: 120px; min-width: 120px; }
    .player-controls { gap: 4px; }
    .ctrl-btn { padding: 5px 10px; font-size: 12px; }
    .source-tab { padding: 8px 12px; font-size: 13px; }
}
@media (max-width: 400px) {
    .catalog { grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px; }
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* Hide scrollbar for category bar */
.category-bar::-webkit-scrollbar { display: none; }
.category-bar { -ms-overflow-style: none; scrollbar-width: none; }
.source-tabs::-webkit-scrollbar { display: none; }
.source-tabs { -ms-overflow-style: none; scrollbar-width: none; }

.no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
}
.no-results .icon { font-size: 48px; margin-bottom: 12px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
    <button class="back-btn" id="backBtn" onclick="goBack()">← กลับ</button>
    <div class="logo" onclick="goHome()">StreamHub</div>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="ค้นหา..." onkeydown="if(event.key==='Enter')doSearch()">
        <button class="search-btn" onclick="doSearch()">🔍</button>
    </div>
</div>

<!-- Source Tabs -->
<div class="source-tabs" id="sourceTabs"></div>

<!-- Category Bar -->
<div class="category-bar" id="categoryBar"></div>

<!-- Views -->
<div id="catalogView">
    <div class="catalog" id="catalogGrid"></div>
    <div class="load-more" id="loadMore" style="display:none">
        <button onclick="loadNextPage()">โหลดเพิ่ม</button>
    </div>
</div>

<div class="detail-view" id="detailView"></div>

<div class="player-view" id="playerView">
    <div class="player-title" id="playerTitle"></div>
    <div class="server-tabs" id="serverTabs"></div>
    <div class="player-container" id="playerContainer">
        <video id="videoPlayer" controls playsinline></video>
        <div class="stall-indicator" id="stallIndicator">⚡ กำลังกู้คืน...</div>
    </div>
    <div class="player-controls">
        <button class="ctrl-btn" onclick="skipTime(-10)">⏪ -10s</button>
        <button class="ctrl-btn" onclick="skipTime(10)">⏩ +10s</button>
        <button class="ctrl-btn" onclick="skipTime(-60)">⏪ -1m</button>
        <button class="ctrl-btn" onclick="skipTime(60)">⏩ +1m</button>
        <button class="ctrl-btn" id="autoNextBtn" onclick="toggleAutoNext()">🔄 Auto-Next: ON</button>
        <button class="ctrl-btn" id="prevEpBtn" onclick="playPrevEpisode()" style="display:none">⬅ ตอนก่อน</button>
        <button class="ctrl-btn" id="nextEpBtn" onclick="playNextEpisode()">➡ ตอนต่อไป</button>
        <div class="brightness-ctrl" id="brightnessCtrl">
            <span title="ความสว่าง">☀️</span>
            <input type="range" id="brightnessSlider" min="20" max="220" value="100"
                   oninput="setVideoBrightness(this.value)" title="ปรับความสว่าง">
            <span class="bval" id="brightnessVal">100%</span>
            <button class="ctrl-btn" onclick="resetBrightness()" style="padding:3px 9px;font-size:11px" title="รีเซ็ต">↺</button>
        </div>
    </div>
</div>

<div class="loading" id="loadingIndicator" style="display:none">
    <div class="spinner"></div>
    <div>กำลังโหลด...</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// STATE MANAGEMENT
// ============================================================
const state = {
    sources: [],
    currentSource: null,
    currentCategory: 'all',
    currentPage: 1,
    hasNext: false,
    view: 'catalog', // catalog, detail, player
    viewHistory: [],
    detail: null,
    // Player
    currentVideoType: null, // 'hls' or 'iframe'
    hls: null,
    autoNext: true,
    stallRecoveryActive: false,
    stallCount: 0,
    stallTimer: null,
    stallCheckInterval: null,  // position-based stall checker
    serverFailCount: 0,        // consecutive recovery failures on this server
    currentEpisodeIndex: -1,
    episodes: [],
    currentSlug: '',
    videos: [],
};

// ============================================================
// INITIALIZATION
// ============================================================
async function init() {
    try {
        const res = await fetch('/api/sources');
        const data = await res.json();
        state.sources = data.sources;
        renderSourceTabs();
        if (state.sources.length > 0) {
            selectSource(state.sources[0].id);
        }
    } catch (e) {
        showToast('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์');
    }
}

// ============================================================
// SOURCE TABS
// ============================================================
function renderSourceTabs() {
    const el = document.getElementById('sourceTabs');
    el.innerHTML = state.sources.map(s =>
        `<div class="source-tab ${state.currentSource === s.id ? 'active' : ''}" onclick="selectSource('${s.id}')">
            <span>${s.icon}</span> ${s.name}
        </div>`
    ).join('');
}

function selectSource(sourceId) {
    state.currentSource = sourceId;
    state.currentCategory = 'all';
    state.currentPage = 1;
    renderSourceTabs();
    renderCategories();
    showView('catalog');
    loadCatalog();
}

// ============================================================
// CATEGORIES
// ============================================================
function renderCategories() {
    const source = state.sources.find(s => s.id === state.currentSource);
    if (!source) return;
    const el = document.getElementById('categoryBar');
    el.innerHTML = source.categories.map(cat =>
        `<button class="cat-btn ${state.currentCategory === cat ? 'active' : ''}" onclick="selectCategory('${cat}')">${cat}</button>`
    ).join('');
}

function selectCategory(cat) {
    state.currentCategory = cat;
    state.currentPage = 1;
    renderCategories();
    loadCatalog();
}

// ============================================================
// CATALOG
// ============================================================
async function loadCatalog(append = false) {
    if (!append) {
        document.getElementById('catalogGrid').innerHTML = '';
        showLoading(true);
    }

    try {
        const res = await fetch(`/api/catalog/${state.currentSource}?page=${state.currentPage}&category=${encodeURIComponent(state.currentCategory)}`);
        const data = await res.json();

        if (data.items && data.items.length > 0) {
            renderCatalog(data.items, append);
            state.hasNext = data.has_next;
            document.getElementById('loadMore').style.display = data.has_next ? 'block' : 'none';
        } else if (!append) {
            document.getElementById('catalogGrid').innerHTML = `
                <div class="no-results" style="grid-column:1/-1">
                    <div class="icon">📭</div>
                    <div>ไม่พบรายการ</div>
                </div>`;
            document.getElementById('loadMore').style.display = 'none';
        }
    } catch (e) {
        if (!append) {
            document.getElementById('catalogGrid').innerHTML = `
                <div class="no-results" style="grid-column:1/-1">
                    <div class="icon">⚠️</div>
                    <div>เกิดข้อผิดพลาด</div>
                </div>`;
        }
    }
    showLoading(false);
}

function renderCatalog(items, append) {
    const grid = document.getElementById('catalogGrid');
    const html = items.map(item => `
        <div class="card" onclick="openDetail('${item.slug}')">
            <img class="poster" src="/proxy/image?url=${encodeURIComponent(item.image)}" alt="${escapeHtml(item.title)}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 300%22><rect fill=%22%231a1a28%22 width=%22200%22 height=%22300%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23555%22 text-anchor=%22middle%22 font-size=%2240%22>🎬</text></svg>'">
            <div class="info">
                <h3>${escapeHtml(item.title)}</h3>
                ${item.quality ? `<span class="quality-badge">${escapeHtml(item.quality)}</span>` : ''}
            </div>
        </div>
    `).join('');
    if (append) {
        grid.innerHTML += html;
    } else {
        grid.innerHTML = html;
    }
}

function loadNextPage() {
    state.currentPage++;
    loadCatalog(true);
}

// ============================================================
// SEARCH
// ============================================================
async function doSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;

    showView('catalog');
    document.getElementById('catalogGrid').innerHTML = '';
    showLoading(true);
    document.getElementById('loadMore').style.display = 'none';

    try {
        const res = await fetch(`/api/search/${state.currentSource}?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        if (data.length > 0) {
            renderCatalog(data, false);
        } else {
            document.getElementById('catalogGrid').innerHTML = `
                <div class="no-results" style="grid-column:1/-1">
                    <div class="icon">🔍</div>
                    <div>ไม่พบ "${escapeHtml(q)}"</div>
                </div>`;
        }
    } catch (e) {
        showToast('ค้นหาล้มเหลว');
    }
    showLoading(false);
}

// ============================================================
// DETAIL VIEW
// ============================================================
async function openDetail(slug) {
    state.viewHistory.push({ view: state.view, source: state.currentSource, category: state.currentCategory, page: state.currentPage });
    showView('detail');
    showLoading(true);

    try {
        const res = await fetch(`/api/detail/${state.currentSource}/${slug}`);
        const data = await res.json();
        state.detail = data;
        state.episodes = data.episodes || [];
        renderDetail(data);
    } catch (e) {
        showToast('ไม่สามารถโหลดรายละเอียด');
        goBack();
    }
    showLoading(false);
}

function renderDetail(data) {
    const el = document.getElementById('detailView');
    const posterUrl = data.poster ? `/proxy/image?url=${encodeURIComponent(data.poster)}` : '';

    let episodesHtml = '';
    if (data.episodes && data.episodes.length > 0) {
        episodesHtml = `
            <h3 style="margin-bottom:8px;font-size:14px;color:var(--text2)">ตอนทั้งหมด (${data.episodes.length})</h3>
            <div class="episode-grid">
                ${data.episodes.map((ep, idx) =>
                    `<button class="ep-btn" onclick="playEpisode(${idx})">${ep.title || 'ตอน ' + ep.number}</button>`
                ).join('')}
            </div>`;
    } else if (data.post_id) {
        // Single movie - play directly
        episodesHtml = `<button class="ep-btn" onclick="playEpisode(0)" style="margin-top:12px;background:var(--accent);color:#fff;border-color:var(--accent)">▶ เล่นเลย</button>`;
    }

    el.innerHTML = `
        <div class="detail-header">
            <div class="detail-poster">
                ${posterUrl ? `<img src="${posterUrl}" alt="">` : ''}
            </div>
            <div class="detail-info">
                <h1>${escapeHtml(data.title)}</h1>
                <p class="synopsis">${escapeHtml(data.synopsis || '')}</p>
                <div style="font-size:12px;color:var(--text2)">จำนวนตอน: ${data.episode_count || 1}</div>
            </div>
        </div>
        ${episodesHtml}
    `;
}

// ============================================================
// PLAYER
// ============================================================
async function playEpisode(index) {
    state.currentEpisodeIndex = index;
    const ep = state.episodes[index];
    if (!ep) return;

    state.viewHistory.push({ view: state.view, source: state.currentSource });
    showView('player');
    showLoading(true);

    const slug = ep.slug;
    state.currentSlug = slug;

    try {
        const res = await fetch(`/api/episode/${state.currentSource}/${slug}`);
        const data = await res.json();

        state.videos = data.videos || [];

        // Set title
        document.getElementById('playerTitle').textContent =
            `${state.detail ? state.detail.title + ' - ' : ''}ตอนที่ ${ep.number || (index + 1)}`;

        // Render server tabs
        renderServerTabs();

        // Update nav buttons
        document.getElementById('prevEpBtn').style.display = index > 0 ? 'inline-block' : 'none';
        document.getElementById('nextEpBtn').style.display = index < state.episodes.length - 1 ? 'inline-block' : 'none';

        // Auto-play first server
        if (state.videos.length > 0) {
            playServer(0);
        } else {
            showToast('ไม่พบวิดีโอ');
        }
    } catch (e) {
        showToast('ไม่สามารถโหลดวิดีโอ');
    }
    showLoading(false);
}

function renderServerTabs() {
    const el = document.getElementById('serverTabs');
    const defaultLabels = ['เซิร์ฟเวอร์หลัก', 'สำรอง 1', 'สำรอง 2'];
    el.innerHTML = state.videos.map((v, i) => {
        let label = v.label ? `${v.label}` : (defaultLabels[i] || 'เซิร์ฟเวอร์ ' + (i + 1));
        if (v.type === 'direct') label = '▶ ' + label;
        return `<button class="server-tab ${i === 0 ? 'active' : ''}" onclick="playServer(${i})" data-idx="${i}">
            ${label}
        </button>`;
    }).join('');
}

function playServer(index) {
    // Update active tab
    document.querySelectorAll('.server-tab').forEach((t, i) =>
        t.classList.toggle('active', i === index));

    const video = state.videos[index];
    if (!video) return;

    stopPlayer();

    if (video.type === 'hls' && video.video_id) {
        playHLS(video.video_id, video.m3u8_url);
    } else if (video.type === 'direct' && video.direct_url) {
        playDirect(video.direct_url, video.label || '');
    } else if (video.embed_url) {
        playIframe(video.embed_url);
    }
}

function playHLS(videoId, m3u8Url) {
    state.currentVideoType = 'hls';
    const container = document.getElementById('playerContainer');
    container.innerHTML = `<video id="videoPlayer" controls playsinline autoplay></video>
        <div class="stall-indicator" id="stallIndicator">⚡ กำลังกู้คืน...</div>`;
    const videoEl = document.getElementById('videoPlayer');

    // Determine master URL based on CDN source
    let masterUrl;
    if (m3u8Url && m3u8Url.includes('anccplayer')) {
        // AnimeGojo anccplayer HLS
        masterUrl = `/hls/ancc/${videoId}`;
    } else if (m3u8Url && (m3u8Url.includes('top-cdn.com') || m3u8Url.includes('ok-hd.com'))) {
        // WowDrama top-cdn/ok-hd HLS
        const cdn = m3u8Url.includes('ok-hd.com') ? 'ok-hd.com' : 'top-cdn.com';
        masterUrl = `/hls/topcdn/${videoId}?cdn=${cdn}`;
    } else if (m3u8Url && (m3u8Url.includes('24playerhd') || m3u8Url.includes('newplaylist'))) {
        // 24playerhd HLS
        const isBackup = m3u8Url.includes('newplaylist_g');
        masterUrl = `/hls/master/${videoId}${isBackup ? '?backup=1' : ''}`;
    } else {
        // Generic HLS proxy (k35tanmai, anifume, etc.)
        masterUrl = `/hls/generic/${videoId}`;
    }

    if (Hls.isSupported()) {
        const hls = new Hls({
            // ---- BUFFER ----
            maxBufferLength: 60,            // pre-buffer 60s
            maxMaxBufferLength: 120,        // allow up to 120s
            maxBufferHole: 0.5,             // auto-skip buffer holes ≤ 0.5s
            maxBufferSize: 150 * 1000 * 1000, // 150 MB in-memory cap
            // ---- QUALITY ----
            startLevel: -1,                 // auto quality
            capLevelToPlayerSize: true,
            // ---- RETRIES ----
            fragLoadingMaxRetry: 8,
            fragLoadingRetryDelay: 500,
            fragLoadingMaxRetryTimeout: 30000,
            manifestLoadingMaxRetry: 6,
            manifestLoadingRetryDelay: 500,
            levelLoadingMaxRetry: 6,
            levelLoadingRetryDelay: 500,
            // ---- PERFORMANCE ----
            enableWorker: true,
            lowLatencyMode: false,
            progressive: true,
        });
        state.hls = hls;

        hls.loadSource(masterUrl);
        hls.attachMedia(videoEl);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            videoEl.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
            console.warn('[HLS Error]', data.type, data.details, data.fatal);
            if (data.fatal) {
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    showToast('⚠️ เครือข่ายขัดข้อง - กำลังลองใหม่อัตโนมัติ');
                    hls.startLoad();
                } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    showToast('⚠️ ข้อผิดพลาดมีเดีย - กำลังกู้คืน');
                    hls.recoverMediaError();
                } else {
                    // fatal decode/other error - try next server
                    showToast('❌ ไม่สามารถโหลดได้ - ลองเซิร์ฟเวอร์สำรอง');
                    setTimeout(() => autoSwitchServer(), 1500);
                }
            }
        });
    } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        // Native HLS (Safari)
        videoEl.src = masterUrl;
        videoEl.play().catch(() => {});
    }

    // Setup stall recovery and auto-next
    setupPlayerEvents(videoEl);

    // Restore brightness setting to the new video element
    try {
        const saved = sessionStorage.getItem('sh_brightness');
        if (saved && saved !== '100') {
            videoEl.style.filter = `brightness(${saved}%)`;
        }
    } catch(e) {}
}

function playDirect(directUrl, label) {
    state.currentVideoType = 'direct';
    const container = document.getElementById('playerContainer');
    container.innerHTML = `<video id="videoPlayer" controls playsinline autoplay></video>
        <div class="stall-indicator" id="stallIndicator">⚡ กำลังกู้คืน...</div>`;
    const videoEl = document.getElementById('videoPlayer');
    videoEl.src = directUrl;
    videoEl.play().catch(() => {});

    // Setup stall recovery and auto-next
    setupPlayerEvents(videoEl);

    // Restore brightness
    try {
        const saved = sessionStorage.getItem('sh_brightness');
        if (saved && saved !== '100') {
            videoEl.style.filter = `brightness(${saved}%)`;
        }
    } catch(e) {}

    if (label) showToast(`▶ กำลังเล่น ${label}`);
}

function playIframe(embedUrl) {
    state.currentVideoType = 'iframe';
    const container = document.getElementById('playerContainer');
    container.innerHTML = `<iframe src="${embedUrl}" allowfullscreen allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>`;
}

function stopPlayer() {
    state.stallCount = 0;
    state.stallRecoveryActive = false;
    state.serverFailCount = 0;
    if (state.stallTimer) {
        clearInterval(state.stallTimer);
        clearTimeout(state.stallTimer);
        state.stallTimer = null;
    }
    if (state.stallCheckInterval) {
        clearInterval(state.stallCheckInterval);
        state.stallCheckInterval = null;
    }
    hideRecoveryOverlay();
    hideStallIndicator();
    if (state.hls) {
        state.hls.destroy();
        state.hls = null;
    }
    const v = document.getElementById('videoPlayer');
    if (v) {
        v.pause();
        v.src = '';
    }
}

// ============================================================
// PLAYER EVENTS & STALL RECOVERY
// ============================================================
function setupPlayerEvents(videoEl) {
    let lastPos = -1;
    let lastPosAt = Date.now();
    const STALL_THRESHOLD_MS = 5000;   // frozen position for 5s = stall
    const AUTO_SWITCH_AFTER = 3;       // switch server after N consecutive recoveries

    state.serverFailCount = 0;

    // Auto-next on video end
    videoEl.addEventListener('ended', () => {
        if (state.autoNext && state.currentEpisodeIndex < state.episodes.length - 1) {
            showToast('⏭ กำลังเล่นตอนต่อไป...');
            setTimeout(() => playNextEpisode(), 2000);
        }
    });

    // Reset position tracker when playback resumes
    videoEl.addEventListener('playing', () => {
        lastPos = videoEl.currentTime;
        lastPosAt = Date.now();
        state.stallCount = 0;
        hideStallIndicator();
    });

    videoEl.addEventListener('seeked', () => {
        lastPos = videoEl.currentTime;
        lastPosAt = Date.now();
    });

    // ---- Position-based stall detector (runs every second) ----
    if (state.stallCheckInterval) {
        clearInterval(state.stallCheckInterval);
        state.stallCheckInterval = null;
    }
    state.stallCheckInterval = setInterval(() => {
        if (!videoEl || videoEl.paused || videoEl.ended) {
            // Not playing - update reference so we don't false-trigger on resume
            lastPos = videoEl ? videoEl.currentTime : lastPos;
            lastPosAt = Date.now();
            return;
        }
        if (state.stallRecoveryActive) return;

        const curPos = videoEl.currentTime;
        if (curPos !== lastPos) {
            // Playback is progressing - healthy
            lastPos = curPos;
            lastPosAt = Date.now();
            state.stallCount = 0;
            hideStallIndicator();
        } else {
            // Position frozen
            const frozenMs = Date.now() - lastPosAt;
            if (frozenMs >= STALL_THRESHOLD_MS) {
                // Real stall confirmed
                state.stallCount++;
                lastPosAt = Date.now(); // reset timer so we don't fire every second
                console.warn(`[Stall] detected #${state.stallCount}, frozenMs=${frozenMs}`);

                if (state.stallCount >= AUTO_SWITCH_AFTER && state.videos.length > 1) {
                    // Too many stalls on this server - switch
                    state.stallCount = 0;
                    state.serverFailCount++;
                    showToast('⚠️ สลับเซิร์ฟเวอร์อัตโนมัติ...');
                    setTimeout(() => autoSwitchServer(), 500);
                } else if (!state.stallRecoveryActive) {
                    performStallRecovery(videoEl);
                }
            }
        }
    }, 1000);
}

function performStallRecovery(videoEl) {
    state.stallRecoveryActive = true;
    const savedTime = videoEl.currentTime;
    const duration = videoEl.duration;
    const remaining = (duration && !isNaN(duration) && duration > 0) ? duration - savedTime : Infinity;

    // If remaining time < 15s: skip to next episode instead of stall recovery
    if (remaining < 15) {
        state.stallRecoveryActive = false;
        state.stallCount = 0;
        hideStallIndicator();
        if (state.autoNext && state.currentEpisodeIndex < state.episodes.length - 1) {
            showToast('⏭ เหลือเวลาน้อยกว่า 15 วิ - ข้ามตอนต่อไป...');
            setTimeout(() => playNextEpisode(), 1500);
        } else {
            showToast('ใกล้จบตอนแล้ว');
        }
        return;
    }

    showStallIndicator();
    showToast('⚡ ตรวจพบค้าง - กำลังกู้คืน...');

    // Show overlay to hide the 10s-ahead scene
    showRecoveryOverlay(3);

    // Jump forward exactly 10 seconds to reload buffer
    videoEl.currentTime = Math.min(savedTime + 10, (duration > 0 ? duration - 1 : savedTime + 10));

    // 3-second countdown then jump back to original stall position
    let countdown = 3;
    state.stallTimer = setInterval(() => {
        countdown--;
        updateRecoveryCountdown(countdown);
        if (countdown <= 0) {
            clearInterval(state.stallTimer);
            state.stallTimer = null;
            // Jump back exactly where stall happened
            videoEl.currentTime = savedTime;
            hideRecoveryOverlay();
            hideStallIndicator();
            state.stallRecoveryActive = false;
            state.stallCount = 0;
            videoEl.play().catch(() => {});
            showToast('✅ กู้คืนสำเร็จ - กลับฉากเดิม');
        }
    }, 1000);
}

function showRecoveryOverlay(countdown) {
    const container = document.getElementById('playerContainer');
    if (!container) return;
    let overlay = document.getElementById('recoveryOverlay');
    if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'recoveryOverlay';
        overlay.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.90);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;color:#fff;';
        overlay.innerHTML = `
            <div id="recoveryCountdown" style="font-size:64px;font-weight:bold;line-height:1;color:#a29bfe">${countdown}</div>
            <div style="font-size:15px;color:#bbb;margin-top:12px;text-align:center">⚡ กำลังกู้คืนวิดีโอ<br>กรุณารอสักครู่...</div>
            <div style="margin-top:18px;width:40px;height:40px;border:3px solid rgba(255,255,255,0.2);border-top-color:#a29bfe;border-radius:50%;animation:spin 1s linear infinite"></div>
        `;
        container.appendChild(overlay);
    } else {
        const el = document.getElementById('recoveryCountdown');
        if (el) el.textContent = countdown;
        overlay.style.display = 'flex';
    }
}

function updateRecoveryCountdown(n) {
    const el = document.getElementById('recoveryCountdown');
    if (el) el.textContent = n > 0 ? n : '...';
}

function hideRecoveryOverlay() {
    const overlay = document.getElementById('recoveryOverlay');
    if (overlay) overlay.style.display = 'none';
}

function showStallIndicator() {
    const el = document.getElementById('stallIndicator');
    if (el) el.style.display = 'block';
}

function hideStallIndicator() {
    const el = document.getElementById('stallIndicator');
    if (el) el.style.display = 'none';
}

// Auto-switch to next available server when current one keeps stalling
function autoSwitchServer() {
    const tabs = document.querySelectorAll('.server-tab');
    let currentIdx = 0;
    tabs.forEach((t, i) => { if (t.classList.contains('active')) currentIdx = i; });
    const nextIdx = (currentIdx + 1) % state.videos.length;
    if (nextIdx !== currentIdx) {
        showToast(`🔄 สลับไปเซิร์ฟเวอร์สำรอง ${nextIdx + 1}`);
        playServer(nextIdx);
    } else {
        showToast('⚠️ ไม่สามารถโหลดวิดีโอได้ - กรุณาลองใหม่อีกครั้ง');
    }
}

// ============================================================
// PLAYER CONTROLS
// ============================================================
function skipTime(seconds) {
    const v = document.getElementById('videoPlayer');
    if (v && (state.currentVideoType === 'hls' || state.currentVideoType === 'direct')) {
        v.currentTime += seconds;
    }
}

function toggleAutoNext() {
    state.autoNext = !state.autoNext;
    const btn = document.getElementById('autoNextBtn');
    btn.textContent = `🔄 Auto-Next: ${state.autoNext ? 'ON' : 'OFF'}`;
    btn.classList.toggle('active', state.autoNext);
    showToast(state.autoNext ? 'Auto-Next เปิด' : 'Auto-Next ปิด');
}

function playNextEpisode() {
    if (state.currentEpisodeIndex < state.episodes.length - 1) {
        // Remove current player view from history to avoid loops
        state.viewHistory.pop();
        playEpisode(state.currentEpisodeIndex + 1);
    } else {
        showToast('ไม่มีตอนต่อไป');
    }
}

function playPrevEpisode() {
    if (state.currentEpisodeIndex > 0) {
        state.viewHistory.pop();
        playEpisode(state.currentEpisodeIndex - 1);
    }
}

// ============================================================
// VIEW MANAGEMENT
// ============================================================
function showView(view) {
    state.view = view;
    document.getElementById('catalogView').style.display = view === 'catalog' ? 'block' : 'none';
    document.getElementById('detailView').style.display = view === 'detail' ? 'block' : 'none';
    document.getElementById('playerView').style.display = view === 'player' ? 'block' : 'none';
    document.getElementById('backBtn').style.display = view !== 'catalog' ? 'inline-block' : 'none';
    document.getElementById('categoryBar').style.display = view === 'catalog' ? 'flex' : 'none';

    if (view !== 'player') {
        stopPlayer();
    }
}

function goBack() {
    if (state.viewHistory.length > 0) {
        const prev = state.viewHistory.pop();
        showView(prev.view);
        if (prev.view === 'catalog') {
            document.getElementById('catalogView').style.display = 'block';
        }
    } else {
        showView('catalog');
    }
}

function goHome() {
    state.viewHistory = [];
    stopPlayer();
    showView('catalog');
}

// ============================================================
// UTILITY
// ============================================================
function showLoading(show) {
    document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
}

function showToast(message) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3000);
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ============================================================
// BRIGHTNESS CONTROL
// ============================================================
function setVideoBrightness(val) {
    val = Math.max(20, Math.min(220, parseInt(val)));
    const v = document.getElementById('videoPlayer');
    if (v) v.style.filter = `brightness(${val}%)`;
    const label = document.getElementById('brightnessVal');
    if (label) label.textContent = val + '%';
    // Persist in session
    try { sessionStorage.setItem('sh_brightness', val); } catch(e) {}
}

function resetBrightness() {
    const slider = document.getElementById('brightnessSlider');
    if (slider) { slider.value = 100; setVideoBrightness(100); }
}

// Restore brightness slider value from session on initial load
(function restoreBrightness() {
    try {
        const saved = sessionStorage.getItem('sh_brightness');
        if (saved) {
            const slider = document.getElementById('brightnessSlider');
            if (slider) { slider.value = saved; }
            const label = document.getElementById('brightnessVal');
            if (label) label.textContent = saved + '%';
        }
    } catch(e) {}
})();

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', (e) => {
    if (state.view !== 'player') return;
    if (e.target.tagName === 'INPUT') return;

    switch(e.key) {
        case 'ArrowLeft': skipTime(-10); e.preventDefault(); break;
        case 'ArrowRight': skipTime(10); e.preventDefault(); break;
        case 'n': case 'N': playNextEpisode(); break;
        case 'p': case 'P': playPrevEpisode(); break;
        case 'Escape': goBack(); break;
    }
});

// Initialize
init();
</script>
